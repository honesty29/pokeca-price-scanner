<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ポケカ価格管理 V14</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;padding:18px 16px}main{max-width:720px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0001}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:18px}button,a{border:0;border-radius:10px;padding:12px 14px;font-weight:700;text-decoration:none;display:inline-block}.primary{background:#2563eb;color:white;width:100%;margin-top:10px}.secondary{background:#e5e7eb;color:#111827}.result{display:grid;grid-template-columns:125px 1fr;gap:14px}.result img{width:125px;border-radius:8px}.price{font-size:25px;font-weight:800;margin:8px 0}.muted{font-size:12px;color:#6b7280}.notice{font-size:12px;background:#fff7ed;padding:10px;border-radius:9px;margin-top:10px}@media(max-width:480px){.result{grid-template-columns:100px 1fr}.result img{width:100px}}</style></head>
<body><header><b>📷 ポケカ価格管理 V14</b><div style="font-size:12px;opacity:.75">カード番号 → カード情報 → トレカキングダム買取価格</div></header><main>
<section class="card"><label>カード番号</label><input id="code" placeholder="例：S4a 308/190"><button class="primary" id="search">カードを検索</button><div class="notice">カード左下の番号を入力してください。例：S4a 308/190</div></section>
<section class="card" id="result" style="display:none"><div class="result"><img id="img" alt=""><div><div class="muted" id="id"></div><div id="name" style="font-size:19px;font-weight:800">—</div><div class="muted" id="set"></div><div class="price" id="price">取得中…</div><div class="muted">トレカキングダム 買取目安</div></div></div><div style="margin-top:12px"><a id="king" class="primary" target="_blank">トレカキングダム検索</a><a id="mercari" class="secondary" target="_blank">メルカリ検索</a></div></section>
<section class="card"><label>Cloudflare Worker URL（価格自動取得用）</label><input id="worker" placeholder="https://xxxxx.workers.dev"><button class="secondary" id="setWorker" style="margin-top:8px">Worker URLを保存</button><div class="muted" style="margin-top:7px">設定したWorkerへ /price を送ります。</div></section>
</main>
<script>
const $=x=>document.getElementById(x);
$("worker").value=localStorage.getItem("pokeca_worker_url")||"";
$("setWorker").onclick=()=>{localStorage.setItem("pokeca_worker_url",$("worker").value.trim().replace(/\/$/,""));alert("保存しました");};
function parse(s){s=s.trim().replace(/[‐‑‒–—−]/g,"-").replace(/\s+/g," ");let m=s.match(/^([A-Za-z0-9]+)[ -](\d+)(?:\/(\d+))?$/i);if(!m)m=s.match(/^([A-Za-z0-9]+)\s*(\d+)\s*\/\s*(\d+)$/i);return m?{set:m[1],num:m[2],total:m[3]||"",raw:s}:null}
async function cardInfo(c){let id=(c.set+"-"+c.num).toLowerCase();let r=await fetch("https://api.tcgdex.net/v2/ja/cards/"+encodeURIComponent(id));if(!r.ok)throw Error();return r.json()}
function kingdom(c,n){return "https://shop.japan-toreca.com/search?q="+encodeURIComponent((n||"")+" "+c.set+" "+c.num+" "+c.total+" 買取")}
function mercari(c,n){return "https://jp.mercari.com/search?keyword="+encodeURIComponent((n||"")+" ポケモンカード "+c.set+" "+c.num+(c.total?"/"+c.total:""))}
async function search(){let c=parse($("code").value);if(!c){alert("S4a 308/190 のように入力してください");return}$("result").style.display="block";$("id").textContent=c.raw;$("price").textContent="取得中…";try{let x=await cardInfo(c),n=x.name||"カード名不明";$("name").textContent=n;$("set").textContent=(x.set?.name||c.set)+" / "+(x.localId||c.num);if(x.image)$("img").src=x.image+"/low.webp";$("king").href=kingdom(c,n);$("mercari").href=mercari(c,n);let w=localStorage.getItem("pokeca_worker_url");if(!w){$("price").textContent="Worker URLを設定してください";return}let r=await fetch(w.replace(/\/$/,"")+"/price",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({set:c.set,number:c.num,total:c.total,name:n})});let d=await r.json();$("price").textContent=d.price?Number(d.price).toLocaleString()+"円":"取得できませんでした"}catch(e){$("name").textContent="カード情報を取得できませんでした";$("price").textContent="—"}}
$("search").onclick=search;
</script></body></html>
