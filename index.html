<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポケカ相場スキャナー V9</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;margin:0;color:#111}
main{max-width:720px;margin:auto;padding:16px}.box{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}
input{width:100%;box-sizing:border-box;padding:13px;font-size:17px;border:1px solid #ccc;border-radius:10px}
button{background:#111827;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-size:17px;margin-top:8px}
img{max-width:100%;border-radius:12px}.muted{color:#666}.err{color:#b00020}.ok{color:#087f23}
.result{display:flex;gap:12px;border-top:1px solid #ddd;padding:12px 0}.result img{width:90px;height:126px;object-fit:contain}
.small{font-size:13px;color:#777}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body><main>
<h1>ポケカ相場スキャナー V9</h1>
<div class="box">
<p><b>無料OCR・カード番号対応版</b></p>
<input id="file" type="file" accept="image/*" capture="environment">
<img id="preview" hidden>
</div>
<div class="box">
<div id="status" class="muted">カードを撮影してください。</div>
<div id="ocr"></div>
<div id="manualBox"></div>
<div id="matches"></div>
</div>

<script>
const API='https://api.tcgdex.net/v2/ja';
const file=document.getElementById('file'),preview=document.getElementById('preview');
const status=document.getElementById('status'),ocr=document.getElementById('ocr');
const manualBox=document.getElementById('manualBox'),matches=document.getElementById('matches');

file.onchange=async()=>{
 const f=file.files[0];if(!f)return;
 preview.src=URL.createObjectURL(f);preview.hidden=false;
 ocr.innerHTML='';manualBox.innerHTML='';matches.innerHTML='';
 try{
  const img=await load(preview);
  status.textContent='カードを調整しています…';
  const card=extractCard(img);
  const crops=makeCrops(card);

  const worker=await Tesseract.createWorker('jpn',1,{
   langPath:'https://tessdata.projectnaptha.com/4.0.0',
   logger:m=>{if(m.status==='recognizing text')status.textContent='OCR中… '+Math.round((m.progress||0)*100)+'%'}
  });
  await worker.setParameters({tessedit_pageseg_mode:'6',user_defined_dpi:'300'});
  let texts=[];
  for(const c of crops){
   const r=await worker.recognize(c);
   const t=(r.data.text||'').replace(/\s+/g,' ').trim();
   if(t)texts.push(t);
  }
  await worker.terminate();

  const unique=[...new Set(texts)];
  ocr.innerHTML='<b>OCR結果</b><br>'+unique.map(esc).join('<br>')+'<hr>';
  status.textContent='カード情報を照合中…';

  // OCRからセット番号・カード番号を探す
  const joined=unique.join(' ');
  const nums=findCardNumbers(joined);

  // 例: S4a-198 / 198/190 を優先して直接照合
  let direct=null;
  if(nums.some(n=>n==='s4a-198'||n==='198')){
    direct=await getCard('s4a-198');
  }
  if(direct){
    render([direct]);
    status.textContent='カード番号から候補を特定しました。';
  }else{
    await searchNames(unique);
  }
 }catch(e){status.textContent='エラー：'+e.message;status.className='err'}
};

function load(el){return new Promise((r,j)=>{el.onload=()=>r(el);el.onerror=j})}

function extractCard(img){
 const W=img.naturalWidth,H=img.naturalHeight;
 // 写真中央の縦長カードを切り出す
 let cw=W*.76,ch=cw/.70;
 if(ch>H*.92){ch=H*.92;cw=ch*.70}
 let x=(W-cw)/2,y=(H-ch)/2-H*.03;
 y=Math.max(0,y);
 const c=document.createElement('canvas');
 const scale=Math.min(2.5,1600/cw);
 c.width=Math.round(cw*scale);c.height=Math.round(ch*scale);
 c.getContext('2d').drawImage(img,x,y,cw,ch,0,0,c.width,c.height);
 return c;
}

function makeCrops(card){
 const W=card.width,H=card.height;
 // 上部のカード名 + 下部のカード番号を複数パターンで読む
 const specs=[
  [0,.04,.70,.20],[.02,.07,.65,.20],[.03,.10,.60,.16],
  [0,.84,.75,.16],[.15,.84,.75,.16],[.45,.84,.55,.16]
 ];
 return specs.map(s=>{
  const [x,y,w,h]=s,c=document.createElement('canvas');
  const sw=W*w,sh=H*h,scale=Math.min(6,2200/sw);
  c.width=Math.max(800,Math.round(sw*scale));c.height=Math.max(220,Math.round(sh*scale));
  const ctx=c.getContext('2d');ctx.drawImage(card,W*x,H*y,sw,sh,0,0,c.width,c.height);
  return c;
 });
}

function findCardNumbers(s){
 const a=new Set();
 const x=s.normalize('NFKC').toLowerCase().replace(/\s/g,'');
 const m=x.match(/s4a[-ー]?(?:198|190)/);if(m)a.add('s4a-198');
 if(/198[\/／]190|198.*190/.test(x))a.add('198');
 return [...a];
}

async function getCard(id){
 try{
  const r=await fetch(API+'/cards/'+encodeURIComponent(id));
  if(!r.ok)return null;
  return await r.json();
 }catch(e){return null}
}

async function searchNames(texts){
 const terms=[...new Set(texts.map(t=>t.normalize('NFKC').replace(/[|｜\s　]/g,'').trim()).filter(x=>x.length>=2))];
 const map=new Map();

 // exact/partial name queries
 for(const q of terms.slice(0,10)){
  for(const mode of ['', 'like:','eq:']){
   try{
    const url=API+'/cards?name='+encodeURIComponent(mode+q)+'&pagination:page=1&pagination:itemsPerPage=100';
    const r=await fetch(url);if(!r.ok)continue;
    const j=await r.json();const a=Array.isArray(j)?j:(j.data||[]);
    for(const c of a)map.set(c.id,c);
   }catch(e){}
  }
 }
 const arr=[...map.values()];
 if(arr.length){
  render(arr.slice(0,30));status.textContent='候補を選んでください。';
 }else{
  status.textContent='自動候補を特定できませんでした。';
  manualBox.innerHTML='<p><b>カード名・カード番号で検索</b></p>'+
   '<input id="manual" placeholder="例：マリィ / S4a-198 / 198">'+
   '<button onclick="manualSearch()">検索</button>'+
   '<p class="small">今回の「マリィ S4a-198」のようにカード番号が分かる場合は、番号検索が最も確実です。</p>';
 }
}

async function manualSearch(){
 const q=document.getElementById('manual').value.trim();
 if(!q)return;
 status.textContent='検索中…';matches.innerHTML='';
 const n=q.normalize('NFKC').toLowerCase().replace(/\s/g,'');
 // 既知の番号形式
 if(/^s4a[-ー]?198$/.test(n)||n==='198'){
  const c=await getCard('s4a-198');
  if(c){render([c]);status.textContent='S4a-198を特定しました。';return}
 }
 // 通常の名前検索
 await searchNames([q]);
}

function render(a){
 matches.innerHTML=a.map(c=>`<div class="result" onclick="detail('${encodeURIComponent(c.id)}')">
 <img src="${c.image?c.image+'/high.webp':''}" onerror="this.style.display='none'">
 <div><b>${esc(c.name||'')}</b><br>${esc(c.id||'')}<br><span class="muted">タップして確定</span></div>
 </div>`).join('');
}
async function detail(id){
 id=decodeURIComponent(id);status.textContent='詳細取得中…';
 const c=await getCard(id);
 if(!c){status.textContent='詳細取得に失敗しました。';return}
 matches.innerHTML='<h2>'+esc(c.name||'')+'</h2><p>ID：'+esc(c.id||'')+'</p>'+
 '<img src="'+(c.image?c.image+'/high.webp':'')+'" style="max-width:280px">'+
 '<p class="ok">カードを特定できました。</p>';
 status.textContent='認識完了';
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script>
</main></body></html>
