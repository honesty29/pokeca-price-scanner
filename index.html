<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポケカ相場スキャナー V5</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f5f7;color:#222}
main{max-width:680px;margin:auto;padding:18px}.box{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
button{font-size:17px;padding:13px 18px;border:0;border-radius:12px;background:#111;color:#fff}
input[type=file]{width:100%;font-size:16px} img{max-width:100%;border-radius:12px;margin-top:12px}
.muted{color:#666}.ok{color:#087f23}.err{color:#b00020}.card{display:flex;gap:12px;border-top:1px solid #ddd;padding:12px 0}
.card img{width:82px;height:115px;object-fit:contain;margin:0}.pill{display:inline-block;background:#eee;border-radius:999px;padding:4px 8px;margin:2px}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body><main>
<h1>ポケカ相場スキャナー V5</h1>
<div class="box">
<p><b>無料OCR版</b>：カード上部を自動で切り出して日本語OCRします。</p>
<input id="file" type="file" accept="image/*" capture="environment">
<img id="preview" hidden>
</div>
<div class="box">
<div id="status" class="muted">カード写真を選択してください。</div>
<pre id="ocr" style="white-space:pre-wrap"></pre>
<div id="results"></div>
</div>
<script>
const file=document.getElementById('file'), preview=document.getElementById('preview');
const status=document.getElementById('status'), ocr=document.getElementById('ocr'), results=document.getElementById('results');
const API='https://api.tcgdex.net/v2/ja';

file.onchange=async()=>{
 const f=file.files[0]; if(!f)return;
 preview.src=URL.createObjectURL(f); preview.hidden=false; results.innerHTML=''; ocr.textContent='';
 status.textContent='画像を準備中…';
 try{
   const img=await loadImage(preview);
   // 上部約32%を切り出し、2倍に拡大。カード名が上部にある日本版を想定。
   const crop=prep(img);
   status.textContent='カード名をOCR中…（初回は日本語データの読み込みに少し時間がかかります）';
   const worker=await Tesseract.createWorker('jpn',1,{
      langPath:'https://tessdata.projectnaptha.com/4.0.0',
      logger:m=>{if(m.status==='recognizing text')status.textContent=`OCR中… ${Math.round((m.progress||0)*100)}%`}
   });
   await worker.setParameters({tessedit_pageseg_mode:'7'});
   const r=await worker.recognize(crop);
   await worker.terminate();
   const text=(r.data.text||'').replace(/\s+/g,' ').trim();
   ocr.textContent='OCR結果：'+(text||'（文字を読み取れませんでした）');
   status.textContent='TCGdexで候補を検索中…';
   const terms=makeTerms(text);
   const found=await searchCandidates(terms);
   render(found);
   status.textContent=found.length?'候補を選んでください。':'候補が見つかりませんでした。カードを明るく撮り直して再試行してください。';
 }catch(e){status.textContent='エラー：'+e.message;status.className='err'}
};

function loadImage(el){return new Promise((res,rej)=>{el.onload=()=>res(el);el.onerror=rej})}
function prep(img){
 const c=document.createElement('canvas'), w=img.naturalWidth, h=img.naturalHeight;
 const y=Math.floor(h*0.03), ch=Math.floor(h*0.30);
 c.width=Math.min(1800,Math.floor(w*1.8)); c.height=Math.floor(ch*(c.width/w));
 const x=c.getContext('2d'); x.drawImage(img,0,y,w,ch,0,0,c.width,c.height);
 // 軽いコントラスト強調
 const d=x.getImageData(0,0,c.width,c.height), p=d.data;
 for(let i=0;i<p.length;i+=4){for(let k=0;k<3;k++)p[i+k]=Math.max(0,Math.min(255,(p[i+k]-128)*1.25+128))}
 x.putImageData(d,0,0); return c;
}
function makeTerms(t){
 let s=t.normalize('NFKC').replace(/[|｜]/g,'').trim();
 const arr=[s];
 // OCRで混ざりやすい記号を除いた候補
 const clean=s.replace(/[^ぁ-んァ-ヶ一-龯A-Za-z0-9ー・]/g,' ');
 if(clean&&clean!==s)arr.push(clean);
 return [...new Set(arr.filter(x=>x.length>=2))];
}
async function searchCandidates(terms){
 const out=new Map();
 for(const q of terms.slice(0,2)){
   try{
    const u=API+'/cards?name='+encodeURIComponent(q)+'&pagination:page=1&pagination:itemsPerPage=12';
    const r=await fetch(u); if(!r.ok)continue;
    const j=await r.json();
    (j.data||[]).forEach(c=>out.set(c.id,c));
   }catch(e){}
 }
 return [...out.values()].slice(0,12);
}
function render(cards){
 if(!cards.length){results.innerHTML='<p class="err">候補なし</p>';return}
 results.innerHTML='<h3>候補（タップして詳細）</h3>'+cards.map(c=>`
 <div class="card" onclick="detail('${encodeURIComponent(c.id)}')">
   <img src="${c.image?c.image+'/high.webp':''}" onerror="this.style.display='none'">
   <div><b>${esc(c.name||'')}</b><br><span class="pill">${esc(c.id||'')}</span><br><span class="muted">タップして価格確認</span></div>
 </div>`).join('');
}
async function detail(id){
 id=decodeURIComponent(id); status.textContent='カード詳細を取得中…';
 try{
  const r=await fetch(API+'/cards/'+encodeURIComponent(id)); if(!r.ok)throw Error('TCGdex取得失敗');
  const c=await r.json();
  results.innerHTML=`<div class="box"><h2>${esc(c.name||'')}</h2>
  <p>ID：${esc(c.id||'')}</p>
  <img src="${c.image?c.image+'/high.webp':''}" style="max-width:240px">
  <p class="muted">カード情報を取得しました。価格データは今後の版で連携します。</p></div>`;
  status.textContent='認識完了';
 }catch(e){status.textContent='詳細取得エラー：'+e.message}
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script>
</main></body></html>
