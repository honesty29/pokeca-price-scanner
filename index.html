<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>ポケカ価格管理 V13</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;opacity:.75}
main{max-width:720px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
input{width:100%;font-size:18px;padding:13px;border:1px solid #d1d5db;border-radius:10px}
button,.linkbtn{border:0;border-radius:10px;padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:#2563eb;color:white;width:100%;margin-top:10px}.secondary{background:#e5e7eb;color:#111827}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.result{display:grid;grid-template-columns:130px 1fr;gap:14px}.result img{width:130px;border-radius:9px;background:#eee;min-height:180px;object-fit:contain}
.name{font-size:20px;font-weight:800;margin:2px 0 8px}.muted{font-size:12px;color:#6b7280}.price{font-size:22px;font-weight:800;margin:6px 0}
.site{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee;gap:10px}.site:last-child{border-bottom:0}
.site input{max-width:140px;font-size:16px;padding:8px}.site a{white-space:nowrap}
.notice{background:#fff7ed;border:1px solid #fed7aa;padding:11px;border-radius:10px;font-size:12px;color:#9a3412}
.saved{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee}.saved:last-child{border:0}
.small{font-size:12px}.danger{background:#fee2e2;color:#991b1b}
@media(max-width:500px){.result{grid-template-columns:105px 1fr}.result img{width:105px;min-height:145px}.name{font-size:17px}}
</style>
</head>
<body>
<header><h1>📷 ポケカ価格管理 V13</h1><div class="sub">カード左下の番号からカードを特定して価格を管理</div></header>
<main>
<section class="card">
<label for="code">カード番号</label>
<input id="code" placeholder="例：S4a 198/190、S4a-308、SV8a 223/187">
<div class="row">
<button class="primary" id="search">カードを検索</button>
<button class="secondary" id="cameraBtn">📷 写真を撮る</button>
</div>
<input id="file" type="file" accept="image/*" capture="environment" style="display:none">
<div class="notice" style="margin-top:10px">
番号は「S4a 198/190」のように入力してください。写真は番号確認用です。V13では画像OCRを使わず、番号を基準にします。
</div>
</section>

<section class="card" id="resultCard" style="display:none">
<div class="result">
<img id="cardImg" alt="カード画像">
<div>
<div class="muted" id="cardId"></div>
<div class="name" id="cardName">検索中…</div>
<div class="muted" id="setName"></div>
<div class="price" id="kingPrice">—</div>
<div class="muted">トレカキングダム表示価格</div>
</div>
</div>
<div class="row" style="margin-top:14px">
<a id="kingLink" class="linkbtn primary" target="_blank" rel="noopener">トレカキングダムで検索</a>
<a id="mercariLink" class="linkbtn secondary" target="_blank" rel="noopener">メルカリで検索</a>
</div>
</section>

<section class="card" id="marketCard" style="display:none">
<h2 style="font-size:17px;margin:0 0 8px">価格管理</h2>
<div class="muted" style="margin-bottom:8px">自動取得できないサイトは検索結果を開いて価格を確認し、入力して保存できます。</div>
<div id="sites"></div>
<button class="primary" id="save">このカードを保存</button>
</section>

<section class="card">
<h2 style="font-size:17px;margin:0 0 8px">保存したカード</h2>
<div id="savedList" class="small">まだありません。</div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>encodeURIComponent(s);
let current=null;

function parseCode(raw){
  const s=raw.trim().replace(/[‐‑‒–—−]/g,"-").replace(/\s+/g," ");
  let m=s.match(/^([A-Za-z0-9]+)\s*[- ]\s*(\d+)\s*\/\s*(\d+)/i);
  if(!m) m=s.match(/^([A-Za-z0-9]+)\s*(\d+)\s*\/\s*(\d+)/i);
  if(!m) m=s.match(/^([A-Za-z0-9]+)\s*[- ]\s*(\d+)$/i);
  if(!m) return null;
  return {set:m[1], localId:m[2], total:m[3]||"", raw:s};
}

function cardKingdomUrl(code,name=""){
  const q=(code.raw||code.set+" "+code.localId+" "+code.total)+(name?" "+name:"");
  return "https://shop.japan-toreca.com/search?q="+esc(q);
}
function mercariUrl(code,name=""){
  const q=(name?name+" ":"")+"ポケモンカード "+code.set+" "+code.localId+(code.total?"/"+code.total:"");
  return "https://jp.mercari.com/search?keyword="+esc(q);
}
function yahooUrl(code,name=""){
  const q=(name?name+" ":"")+"ポケモンカード "+code.set+" "+code.localId+(code.total?"/"+code.total:"");
  return "https://auctions.yahoo.co.jp/search/search?p="+esc(q);
}
function rakutenUrl(code,name=""){
  const q=(name?name+" ":"")+"ポケモンカード "+code.set+" "+code.localId+(code.total?"/"+code.total:"");
  return "https://search.rakuten.co.jp/search/mall/"+esc(q)+"/";
}

async function tcgdex(code){
  // TCGdex can resolve an exact card when the set ID is known.
  const url="https://api.tcgdex.net/v2/ja/cards/"+encodeURIComponent(code.set)+"/"+encodeURIComponent(code.localId);
  const r=await fetch(url);
  if(!r.ok) throw new Error("TCGdex "+r.status);
  return await r.json();
}

async function search(){
  const code=parseCode($("code").value);
  if(!code){alert("番号を「S4a 198/190」のように入力してください。");return;}
  current={code};
  $("resultCard").style.display="block";
  $("marketCard").style.display="block";
  $("cardName").textContent="カード情報を取得中…";
  $("cardId").textContent=code.raw;
  $("setName").textContent="";
  $("cardImg").removeAttribute("src");
  $("kingPrice").textContent="—";
  try{
    const c=await tcgdex(code);
    current.card=c;
    $("cardName").textContent=c.name||"カード名不明";
    $("setName").textContent=(c.set?.name||code.set)+" / "+(c.localId||code.localId);
    if(c.image) $("cardImg").src=c.image+"/low.webp";
    const name=c.name||"";
    $("kingLink").href=cardKingdomUrl(code,name);
    $("mercariLink").href=mercariUrl(code,name);
    buildSites(code,name);
  }catch(e){
    $("cardName").textContent="カード情報を取得できませんでした";
    $("setName").textContent="セット記号が正しいか確認してください。";
    $("kingLink").href=cardKingdomUrl(code);
    $("mercariLink").href=mercariUrl(code);
    buildSites(code,"");
  }
}
function buildSites(code,name){
  const sites=[
    ["トレカキングダム",cardKingdomUrl(code,name),"king"],
    ["メルカリ",mercariUrl(code,name),"mercari"],
    ["Yahoo!オークション",yahooUrl(code,name),"yahoo"],
    ["楽天市場",rakutenUrl(code,name),"rakuten"]
  ];
  $("sites").innerHTML=sites.map(([n,u,k])=>`
    <div class="site"><div><b>${n}</b><br><span class="muted">検索結果を開く</span></div>
    <div class="row" style="justify-content:flex-end;align-items:center">
      <input id="p_${k}" type="number" min="0" step="1" placeholder="価格">
      <a class="linkbtn secondary" href="${u}" target="_blank" rel="noopener">検索</a>
    </div></div>`).join("");
}
function save(){
  if(!current)return;
  const c=current.card||{};
  const item={
    id:Date.now(),
    code:current.code.raw,
    name:c.name||"カード名不明",
    image:c.image?c.image+"/low.webp":"",
    set:c.set?.name||current.code.set,
    prices:{
      king:+($("p_king")?.value||0),
      mercari:+($("p_mercari")?.value||0),
      yahoo:+($("p_yahoo")?.value||0),
      rakuten:+($("p_rakuten")?.value||0)
    },
    savedAt:new Date().toLocaleString("ja-JP")
  };
  const arr=JSON.parse(localStorage.getItem("pokeca_v13")||"[]");
  arr.unshift(item); localStorage.setItem("pokeca_v13",JSON.stringify(arr.slice(0,100)));
  renderSaved(); alert("保存しました！");
}
function renderSaved(){
  const arr=JSON.parse(localStorage.getItem("pokeca_v13")||"[]");
  if(!arr.length){$("savedList").textContent="まだありません。";return;}
  $("savedList").innerHTML=arr.map(x=>{
    const vals=Object.values(x.prices).filter(v=>v>0);
    const max=vals.length?Math.max(...vals):0;
    return `<div class="saved"><div><b>${x.name}</b><br><span class="muted">${x.code} / ${x.savedAt}</span><br>管理価格：${max?max.toLocaleString()+"円":"未入力"}</div><button class="danger" onclick="del(${x.id})">削除</button></div>`;
  }).join("");
}
function del(id){
  const arr=JSON.parse(localStorage.getItem("pokeca_v13")||"[]").filter(x=>x.id!==id);
  localStorage.setItem("pokeca_v13",JSON.stringify(arr)); renderSaved();
}
$("search").onclick=search;
$("save").onclick=save;
$("cameraBtn").onclick=()=>$("file").click();
$("file").onchange=()=>{ if($("file").files[0]) alert("写真を撮りました。写真を見ながらカード左下の番号を上の欄に入力してください。"); };
renderSaved();
</script>
</body>
</html>
