<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ポケカ V14</title><style>body{font-family:sans-serif;background:#f3f4f6;margin:0;color:#111827}header{background:#111827;color:white;padding:18px}main{max-width:700px;margin:auto;padding:14px}.c{background:white;padding:16px;border-radius:14px;margin-bottom:14px}input{width:100%;box-sizing:border-box;padding:13px;font-size:18px;border:1px solid #ccc;border-radius:9px}button,a{display:inline-block;padding:12px;border:0;border-radius:9px;font-weight:bold;text-decoration:none}.p{background:#2563eb;color:white;width:100%;margin-top:9px}.s{background:#e5e7eb;color:#111827}.r{display:grid;grid-template-columns:110px 1fr;gap:14px}.r img{width:110px}.price{font-size:25px;font-weight:bold;margin:8px 0}.m{font-size:12px;color:#6b7280}</style><header><b>📷 ポケカ価格管理 V14</b><div class=m>トレカキングダムのみで検索</div></header><main><section class=c><b>カード番号</b><input id=code placeholder="S4a 308/190"><button class=p id=go>トレカキングダムで検索</button></section><section class=c id=res style="display:none"><div class=r><img id=img><div><div class=m id=id></div><b id=name>—</b><div class=m id=set></div><div class=price id=price>—</div><div class=m>トレカキングダム 買取目安</div></div></div><p><a id=search class="p" target=_blank>トレカキングダム検索結果</a> <a id=prod class=s target=_blank style="display:none">商品ページ</a></p><div class=m id=msg></div></section><section class=c><b>Cloudflare Worker URL</b><input id=worker placeholder="https://xxxxx.workers.dev"><button class=s id=save>保存</button></section></main><script>
const $=x=>document.getElementById(x);worker.value=localStorage.getItem("pk_worker")||"";
save.onclick=()=>{localStorage.setItem("pk_worker",worker.value.trim().replace(/\/$/,""));alert("保存しました")};
function parse(x){x=x.trim().replace(/[‐‑‒–—−]/g,"-").replace(/\s+/g," ");let m=x.match(/^([A-Za-z0-9]+)\s*[- ]\s*(\d+)\s*\/\s*(\d+)$/i);if(!m)m=x.match(/^([A-Za-z0-9]+)\s*[- ]\s*(\d+)$/i);return m?{set:m[1],num:m[2],total:m[3]||"",raw:x}:null}
go.onclick=async()=>{let c=parse(code.value);if(!c)return alert("S4a 308/190 のように入力してください");res.style.display="block";id.textContent=c.raw;name.textContent="検索中…";price.textContent="—";search.href="https://shop.japan-toreca.com/search?q="+encodeURIComponent(c.set+" "+c.num+(c.total?"/"+c.total:""));let w=localStorage.getItem("pk_worker");if(!w){name.textContent="Worker URLを設定してください";return}try{let q=await fetch(w.replace(/\/$/,"")+"/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(c)}),d=await q.json();if(!q.ok||d.error)throw Error(d.error||"取得失敗");name.textContent=d.name||"カード名不明";set.textContent=d.set+" / "+d.number;if(d.image)img.src=d.image;if(d.productUrl){prod.href=d.productUrl;prod.style.display="inline-block"}price.textContent=d.buyPrice?Number(d.buyPrice).toLocaleString()+"円":"買取価格を取得できませんでした";msg.textContent="トレカキングダムのみを参照しています"}catch(e){name.textContent="取得できませんでした";msg.textContent=e.message}};
</script></html>
