<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポケカ相場スキャナー V8</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;margin:0;color:#111}
main{max-width:720px;margin:auto;padding:16px}
.box{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}
input[type=file],input[type=text]{width:100%;box-sizing:border-box;padding:13px;font-size:17px;border:1px solid #ccc;border-radius:10px}
button{background:#111827;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-size:17px;margin-top:8px}
img{max-width:100%;border-radius:12px}
.muted{color:#666}.err{color:#b00020}.ok{color:#087f23}
.result{display:flex;gap:12px;border-top:1px solid #ddd;padding:12px 0}
.result img{width:90px;height:126px;object-fit:contain}
canvas{max-width:100%;border-radius:10px}
.small{font-size:13px;color:#777}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<main>
<h1>ポケカ相場スキャナー V8</h1>

<div class="box">
<p><b>無料OCR・カード自動切り出し版</b></p>
<input id="file" type="file" accept="image/*" capture="environment">
<img id="preview" hidden>
</div>

<div class="box">
<div id="status" class="muted">カードを撮影してください。</div>
<div id="debug"></div>
<div id="ocr"></div>
<div id="manualBox"></div>
<div id="matches"></div>
</div>

<script>
const API='https://api.tcgdex.net/v2/ja';
const file=document.getElementById('file');
const preview=document.getElementById('preview');
const status=document.getElementById('status');
const debug=document.getElementById('debug');
const ocr=document.getElementById('ocr');
const manualBox=document.getElementById('manualBox');
const matches=document.getElementById('matches');

file.onchange=async()=>{
 const f=file.files[0]; if(!f)return;
 preview.src=URL.createObjectURL(f); preview.hidden=false;
 debug.innerHTML='';ocr.innerHTML='';manualBox.innerHTML='';matches.innerHTML='';
 try{
  const img=await loadImage(preview);
  status.textContent='写真からカードを探しています…';

  const card=detectCard(img);
  const cardCanvas=extractCard(img,card);
  debug.innerHTML='<p class="small">カード領域を自動調整しました。</p>';

  status.textContent='カード名「マリィ」などの位置を解析中…';
  const crops=makeCardNameCrops(cardCanvas);

  status.textContent='カード名をOCRしています…';
  const worker=await Tesseract.createWorker('jpn',1,{
   langPath:'https://tessdata.projectnaptha.com/4.0.0',
   logger:m=>{
    if(m.status==='recognizing text')
      status.textContent='OCR中… '+Math.round((m.progress||0)*100)+'%';
   }
  });

  await worker.setParameters({
   tessedit_pageseg_mode:'7',
   preserve_interword_spaces:'0',
   user_defined_dpi:'300'
  });

  let texts=[];
  for(const crop of crops){
   const r=await worker.recognize(crop);
   const t=(r.data.text||'').replace(/\s+/g,' ').trim();
   if(t)texts.push(t);
  }
  await worker.terminate();

  const unique=[...new Set(texts)];
  ocr.innerHTML='<b>OCR結果</b><br>'+unique.map(esc).join('<br>')+'<hr>';

  status.textContent='カード候補を検索中…';
  await searchFromOCR(unique);

 }catch(e){
  status.textContent='エラー：'+e.message;
  status.className='err';
 }
};

function loadImage(el){
 return new Promise((res,rej)=>{el.onload=()=>res(el);el.onerror=rej});
}

/*
  画像の中央付近にある縦長のカードを想定して検出。
  今回のような1枚のカード写真に強い方式。
*/
function detectCard(img){
 const W=img.naturalWidth,H=img.naturalHeight;
 const ratio=0.70;
 // まず画像中央の縦長領域をカード候補として使用。
 // 周囲の背景を切り落とし、カードの比率に合わせる。
 let cw=W*0.76;
 let ch=cw/ratio;
 if(ch>H*0.92){ch=H*0.92;cw=ch*ratio}
 let x=(W-cw)/2;
 let y=(H-ch)/2;
 // カードが縦長なので少し上へ寄せる
 y=Math.max(0,y-H*0.03);
 return {x,y,w:cw,h:ch};
}

function extractCard(img,r){
 const c=document.createElement('canvas');
 const scale=Math.min(2.5,1600/r.w);
 c.width=Math.round(r.w*scale);
 c.height=Math.round(r.h*scale);
 const ctx=c.getContext('2d');
 ctx.imageSmoothingEnabled=true;
 ctx.drawImage(img,r.x,r.y,r.w,r.h,0,0,c.width,c.height);
 return c;
}

/*
 カードを切り出した後、
 「カード上端〜約23%」「左〜55%」を中心に複数パターン。
 さらにカード全体の左上からの位置をずらして解析。
*/
function makeCardNameCrops(card){
 const W=card.width,H=card.height;
 const specs=[
  [0.03,0.06,0.55,0.12],
  [0.02,0.04,0.68,0.17],
  [0.05,0.08,0.50,0.10],
  [0.00,0.08,0.72,0.16],
  [0.06,0.03,0.58,0.20],
  [0.00,0.12,0.60,0.13]
 ];
 return specs.map(s=>{
  const [x,y,w,h]=s;
  const sx=W*x,sy=H*y,sw=W*w,sh=H*h;
  const c=document.createElement('canvas');
  const scale=Math.min(6,2200/Math.max(sw,1));
  c.width=Math.max(900,Math.round(sw*scale));
  c.height=Math.max(220,Math.round(sh*scale));
  const ctx=c.getContext('2d');
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(card,sx,sy,sw,sh,0,0,c.width,c.height);

  // コントラスト強調＋軽い二値化
  const d=ctx.getImageData(0,0,c.width,c.height);
  const p=d.data;
  for(let i=0;i<p.length;i+=4){
   let g=.299*p[i]+.587*p[i+1]+.114*p[i+2];
   g=(g-128)*1.65+128;
   g=Math.max(0,Math.min(255,g));
   p[i]=p[i+1]=p[i+2]=g;
  }
  ctx.putImageData(d,0,0);
  return c;
 });
}

function normalize(s){
 return s.normalize('NFKC').replace(/[|｜]/g,'').replace(/[\s　]+/g,'').trim();
}

async function searchFromOCR(texts){
 let terms=[];
 for(const t of texts){
  const n=normalize(t);
  if(n.length>=2)terms.push(n);
 }
 terms=[...new Set(terms)].slice(0,12);

 const map=new Map();

 for(const q of terms){
  try{
   const r=await fetch(API+'/cards?name='+encodeURIComponent(q)+'&pagination:page=1&pagination:itemsPerPage=20');
   if(!r.ok)continue;
   const j=await r.json();
   const arr=Array.isArray(j)?j:(j.data||[]);
   for(const c of arr)map.set(c.id,c);
  }catch(e){}
 }

 const arr=[...map.values()];
 if(arr.length){
  render(arr.slice(0,20));
  status.textContent='候補を選んでください。';
 }else{
  status.textContent='自動候補を特定できませんでした。';
  manualBox.innerHTML=
   '<p><b>カード名を入力して検索</b></p>'+
   '<input id="manual" type="text" placeholder="例：マリィ">'+
   '<button onclick="manualSearch()">検索</button>'+
   '<p class="small">OCRが難しい場合でも、カード名から候補を表示できます。</p>';
 }
}

async function manualSearch(){
 const q=document.getElementById('manual').value.trim();
 if(!q)return;
 status.textContent='検索中…';
 try{
  const r=await fetch(API+'/cards?name='+encodeURIComponent(q)+'&pagination:page=1&pagination:itemsPerPage=30');
  const j=await r.json();
  const arr=Array.isArray(j)?j:(j.data||[]);
  render(arr);
  status.textContent=arr.length?'候補を選んでください。':'見つかりませんでした。';
 }catch(e){status.textContent='検索エラー：'+e.message}
}

function render(arr){
 matches.innerHTML=arr.map(c=>
 `<div class="result" onclick="detail('${encodeURIComponent(c.id)}')">
   <img src="${c.image?c.image+'/high.webp':''}" onerror="this.style.display='none'">
   <div><b>${esc(c.name||'')}</b><br>${esc(c.id||'')}<br>
   <span class="muted">タップしてカードを確定</span></div>
  </div>`).join('');
}

async function detail(id){
 id=decodeURIComponent(id);
 status.textContent='カード詳細を取得中…';
 try{
  const r=await fetch(API+'/cards/'+encodeURIComponent(id));
  if(!r.ok)throw Error('取得失敗');
  const c=await r.json();
  matches.innerHTML=
   `<h2>${esc(c.name||'')}</h2>
    <p>ID：${esc(c.id||'')}</p>
    <img src="${c.image?c.image+'/high.webp':''}" style="max-width:280px">
    <p class="ok">カードを特定できました。</p>
    <p class="muted">次の段階で価格データを接続できます。</p>`;
  status.textContent='認識完了';
 }catch(e){status.textContent='詳細取得エラー：'+e.message}
}

function esc(s){
 return String(s).replace(/[&<>"']/g,m=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[m]));
}
</script>
</main>
</body>
</html>
