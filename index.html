<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポケカ相場スキャナー V6</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;margin:0;color:#222}
main{max-width:700px;margin:auto;padding:16px}.box{background:#fff;padding:16px;border-radius:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
button{border:0;border-radius:12px;padding:12px 16px;font-size:16px;background:#111;color:#fff;margin:4px}
input{font-size:17px;padding:12px;width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:10px}
img{max-width:100%;border-radius:12px}.muted{color:#666}.err{color:#b00020}.ok{color:#087f23}
.result{display:flex;gap:12px;padding:12px 0;border-top:1px solid #ddd}.result img{width:90px;height:126px;object-fit:contain}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head><body><main>
<h1>ポケカ相場スキャナー V6</h1>
<div class="box">
<p><b>無料OCR・複数解析版</b></p>
<input id="file" type="file" accept="image/*" capture="environment">
<img id="preview" hidden>
</div>
<div class="box">
<div id="status" class="muted">カードを撮影してください。</div>
<div id="ocr"></div>
<div id="matches"></div>
</div>
<script>
const API='https://api.tcgdex.net/v2/ja';
const file=document.getElementById('file'), preview=document.getElementById('preview');
const status=document.getElementById('status'), ocr=document.getElementById('ocr'), matches=document.getElementById('matches');
let allCards=null;

file.onchange=async()=>{
 const f=file.files[0]; if(!f)return;
 preview.src=URL.createObjectURL(f); preview.hidden=false;
 ocr.innerHTML='';matches.innerHTML='';
 try{
  const img=await waitImage(preview);
  status.textContent='カード名の位置を切り出しています…';
  const crops=makeCrops(img);
  status.textContent='日本語OCRを実行中…';
  const worker=await Tesseract.createWorker('jpn',1,{
    langPath:'https://tessdata.projectnaptha.com/4.0.0',
    logger:m=>{if(m.status==='recognizing text')status.textContent='OCR中… '+Math.round((m.progress||0)*100)+'%'}
  });
  await worker.setParameters({tessedit_pageseg_mode:'7',preserve_interword_spaces:'1'});
  let texts=[];
  for(let i=0;i<crops.length;i++){
    const r=await worker.recognize(crops[i]);
    const t=(r.data.text||'').replace(/\s+/g,' ').trim();
    if(t)texts.push(t);
  }
  await worker.terminate();
  const unique=[...new Set(texts)];
  ocr.innerHTML='<b>OCR結果</b><br>'+unique.map(esc).join('<br>')+'<hr>';
  status.textContent='カード名候補を照合中…';
  await matchNames(unique);
 }catch(e){status.textContent='エラー：'+e.message;status.className='err'}
};

function waitImage(el){return new Promise((res,rej)=>{el.onload=()=>res(el);el.onerror=rej})}

function makeCrops(img){
 const W=img.naturalWidth,H=img.naturalHeight;
 // 日本版ポケカのタイトル付近を複数パターンで切り出す
 const specs=[
  [0.02,0.00,0.78,0.16],
  [0.00,0.02,0.90,0.22],
  [0.03,0.00,1.00,0.20],
  [0.00,0.05,0.72,0.28]
 ];
 return specs.map(s=>{
   const [x,y,w,h]=s,c=document.createElement('canvas');
   const sw=Math.min(W*w,900), sh=H*h;
   const scale=Math.min(4,1800/sw);
   c.width=Math.round(sw*scale);c.height=Math.round(sh*scale);
   const ctx=c.getContext('2d');
   ctx.drawImage(img,W*x,H*y,sw,sh,0,0,c.width,c.height);
   const d=ctx.getImageData(0,0,c.width,c.height),p=d.data;
   for(let i=0;i<p.length;i+=4){
     const g=.299*p[i]+.587*p[i+1]+.114*p[i+2];
     const v=g<150?0:255;
     p[i]=p[i+1]=p[i+2]=v;
   }
   ctx.putImageData(d,0,0);
   return c;
 });
}

async function matchNames(texts){
 const clean=[...new Set(texts.flatMap(t=>[
   t.replace(/[^\u3040-\u30ff\u3400-\u9fffA-Za-z0-9ー]/g,''),
   t.replace(/[^ぁ-んァ-ヶ一-龯]/g,'')
 ]).filter(x=>x.length>=2))];
 let candidates=[];
 // まずOCR文字列をそのままTCGdex検索
 for(const q of clean.slice(0,8)){
   try{
    const r=await fetch(API+'/cards?name='+encodeURIComponent(q)+'&pagination:page=1&pagination:itemsPerPage=20');
    if(r.ok){const j=await r.json();candidates.push(...(Array.isArray(j)?j:(j.data||[])))}
   }catch(e){}
 }
 const map=new Map(candidates.map(c=>[c.id,c]));
 const arr=[...map.values()];
 if(arr.length){render(arr.slice(0,20));status.textContent='候補が見つかりました。カードを選んでください。';return}
 status.textContent='自動候補を特定できませんでした。';
 matches.innerHTML=`<p>OCRが「マリィ」のような短い名前を正しく読めない場合があります。</p>
 <p><b>カード名を手入力して検索</b></p>
 <input id="manual" placeholder="例：マリィ">
 <button onclick="manualSearch()">検索</button>`;
}
async function manualSearch(){
 const q=document.getElementById('manual').value.trim();if(!q)return;
 status.textContent='検索中…';
 try{
  const r=await fetch(API+'/cards?name='+encodeURIComponent(q)+'&pagination:page=1&pagination:itemsPerPage=30');
  const j=await r.json();const a=Array.isArray(j)?j:(j.data||[]);
  render(a);status.textContent=a.length?'候補を選んでください。':'見つかりませんでした。';
 }catch(e){status.textContent='検索エラー：'+e.message}
}
function render(a){
 matches.innerHTML=a.map(c=>`<div class="result" onclick="detail('${encodeURIComponent(c.id)}')">
 <img src="${c.image?c.image+'/high.webp':''}">
 <div><b>${esc(c.name||'')}</b><br>${esc(c.id||'')}<br><span class="muted">タップして詳細</span></div></div>`).join('');
}
async function detail(id){
 id=decodeURIComponent(id);status.textContent='詳細取得中…';
 const r=await fetch(API+'/cards/'+encodeURIComponent(id));const c=await r.json();
 matches.innerHTML=`<h2>${esc(c.name||'')}</h2><p>ID：${esc(c.id||'')}</p>
 <img src="${c.image?c.image+'/high.webp':''}" style="max-width:260px">
 <p>カードの特定に成功しました。次の段階で価格データを接続できます。</p>`;
 status.textContent='認識完了';
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></main></body></html>
